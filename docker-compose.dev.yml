services:
  db:
    image: postgres:15

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: todo_service

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d todo_service"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app_network


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app_network


  rabbitmq:
    image: rabbitmq:3-management-alpine

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev

    env_file:
      - .env.dev

    environment:
      - ENVIRONMENT=dev

    command: [ "/app/scripts/init-db.sh" ]

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev

    env_file:
      - .env.dev

    environment:
      - ENVIRONMENT=dev

    expose:
      - "8000"

    volumes:
      - .:/app
      - /app/__pycache__

    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - app_network


  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev

    env_file:
      - .env.dev

    environment:
      - ENVIRONMENT=dev

    command: celery -A app.infrastructure.celery.celery_app worker --loglevel=info

    volumes:
      - .:/app
      - /app/__pycache__

    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - app_network


  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev

    env_file:
      - .env.dev

    environment:
      - ENVIRONMENT=dev

    command: celery -A app.infrastructure.celery.celery_app beat --loglevel=info

    volumes:
      - .:/app
      - /app/__pycache__

    depends_on:
      init-db:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - app_network


  nginx:
    image: nginx:alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - backend

    networks:
      - app_network


volumes:
  postgres_data:


networks:
  app_network:
    driver: bridge