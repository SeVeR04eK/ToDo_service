name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Code Base
        uses: github/super-linter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_PYTHON: true
          VALIDATE_YAML: true
          VALIDATE_JSON: true
          DEFAULT_BRANCH: master

  tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --target dev -t myapp .

      - name: Run tests inside container
        run: |
          docker run --entrypoint pytest \
                     -e SECRET_KEY=test_secret_key_32chars_9f2b7c4e1a8d5f0c6b3e7a9d4f1c8b2 \
                     -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
                     -e FIRST_ADMIN_USERNAME=admin \
                     -e FIRST_ADMIN_PASSWORD=admin123 \
                     -e REDIS_HOST=redis \
                     -e REDIS_PORT=6379 \
                     -e REDIS_DB=0 \
                     -e REDIS_SOCKET_TIMEOUT=1.0 \
                     -e REDIS_SOCKET_CONNECT_TIMEOUT=1.0 \
                     --network host \
                     myapp
                     
